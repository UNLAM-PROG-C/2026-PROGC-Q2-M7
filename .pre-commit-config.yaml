repos:
  - repo: local
    hooks:
      - id: pruebas-zip
        name: Pruebas de dominio y sesión de Zip
        entry: bash TP-Integrador/scripts/test.sh
        language: system
        pass_filenames: false
        files: ^TP-Integrador/(src|test|scripts|config)/
      - id: estilo-zip
        name: Estilo de Zip con Checkstyle
        entry: bash TP-Integrador/scripts/check.sh
        language: system
        pass_filenames: false
        files: ^TP-Integrador/(src|test|scripts|config)/
